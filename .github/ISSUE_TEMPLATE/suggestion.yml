name: Suggestion
description: An idea for a feature, a rule fix or a data correction
labels: ["suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what problem does it solve?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      description: How we handle suggestions (credit, private notes, deleting your name) is in the [contributing guide](https://github.com/pixelenjoyer57-droid/limbus-calculator/blob/main/.github/CONTRIBUTING.md).
      options:
        - label: I made this suggestion myself or may share it. I allow it to be used in the app without payment. I am not posting leaks or unreleased game material.
          required: true
