name: Suggestion
description: An idea for a feature, a rule fix or a data correction
labels: ["suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what problem does it solve?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I made this suggestion myself or may share it. I allow it to be used in the app without payment or credit obligation. I am not posting leaks or unreleased game material.
          required: true
