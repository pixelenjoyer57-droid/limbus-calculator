name: Bug report
description: Something in the app is wrong or broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Screen or item
      description: For example "Damage calculator" or the name of the Identity.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on Windows, Safari on iPhone ...
  - type: markdown
    attributes:
      value: Please do not paste private information, and do not post leaked or unreleased game content. Report vulnerabilities privately through the repository's Security tab (see the security policy), not here.
