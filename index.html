<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- GitHub Pages can't send headers, so the Content Security Policy is a meta tag. It must stay the first
         element after charset. Scripts and workers: this origin only (no inline script, no eval). Styles allow
         inline because React sets style="" attributes. No network except this origin (app + game data files).
         frame-ancestors / X-Frame-Options can't be set from a meta tag. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Build custom Limbus Company Identities, E.G.O, enemies, encounters, events and E.G.O Gifts, then test them with a wiki-accurate damage calculator and battle simulator." />
    <meta name="theme-color" content="#111015" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Workshop" />
    <title>Sinner's Workshop</title>
    <style>
      html, body { background: #111015; color: #f1ece3; }
      @media (prefers-color-scheme: light) { html:not([data-theme="dark"]), html:not([data-theme="dark"]) body { background: #f6f3ee; color: #1d1a20; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Sinner's Workshop needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
